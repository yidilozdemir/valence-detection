name: Build PDF report

on:
  push:
    branches:
      - main
    paths:
      - "INTERIM_RESULTS.md"
      - "figures/**"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Build PDF
        run: |
          mkdir -p reports

          pandoc INTERIM_RESULTS.md \
            --from=gfm \
            --standalone \
            --toc \
            --pdf-engine=xelatex \
            --resource-path=. \
            -V geometry:margin=0.8in \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o reports/self_referential_valence_report.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/self_referential_valence_report.pdf

          if git diff --cached --quiet; then
            echo "PDF is unchanged."
          else
            git commit -m "Build PDF report [skip ci]"
            git push
          fi
